name: Compilar SEGOVIA TV

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Descargar repositorio
      uses: actions/checkout@v4

    - name: Configurar Java 17
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Compilar APK Debug
      run: |
        cd vlc-segovia-tv-main
        if [ -f "gradlew" ]; then
          chmod +x gradlew
          ./gradlew :app:assembleDebug --no-daemon
        else
          gradle :app:assembleDebug --no-daemon
        fi

    - name: Guardar APK
      uses: actions/upload-artifact@v4
      with:
        name: SegoviaTV-APK
        path: vlc-segovia-tv-main/application/app/build/outputs/apk/**/*.apk
        
