name: Compilar SEGOVIA TV + VLC

on:
  workflow_dispatch:
  push:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 180

    steps:

      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Instalar dependencias de compilación
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            automake \
            autopoint \
            cmake \
            build-essential \
            libtool-bin \
            patch \
            pkg-config \
            protobuf-compiler \
            ragel \
            subversion \
            unzip \
            git \
            flex \
            python3 \
            wget \
            curl

      - name: Configurar Git
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"

      - name: Configurar Gradle 8.7
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.7"

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ""

      - name: Instalar Android SDK y NDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true

          sdkmanager --install \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;27.2.12479018"

      - name: Verificar herramientas Android
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          java -version
          gradle --version
          sdkmanager --version

          echo "NDK:"
          ls -la "$ANDROID_HOME/ndk/27.2.12479018"

      - name: Preparar variables Android
        working-directory: vlc-segovia-tv-main
        run: |
          echo "ANDROID_SDK=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_NDK=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"

      - name: Preparar verificador de versión de Gradle
        working-directory: vlc-segovia-tv-main
        run: |
          mkdir -p buildsystem/gradle_version

          printf "%s\n" \
            "println 'gradle_version=' + gradle.getGradleVersion()" \
            > buildsystem/gradle_version/build.gradle

          echo "Verificador Gradle creado:"
          cat buildsystem/gradle_version/build.gradle

      - name: Preparar permisos
        working-directory: vlc-segovia-tv-main
        run: |
          chmod +x buildsystem/compile.sh

      - name: Preparar VLC y compilar
        working-directory: vlc-segovia-tv-main
        run: |
          set -o pipefail

          ANDROID_SDK="$ANDROID_HOME" \
          ANDROID_NDK="$ANDROID_HOME/ndk/27.2.12479018" \
          ./buildsystem/compile.sh -b 2>&1 | tee compilacion.log

      - name: Mostrar error real de compilación
        if: failure()
        working-directory: vlc-segovia-tv-main
        run: |
          echo ""
          echo "=============================================="
          echo "          ERROR REAL DE COMPILACIÓN"
          echo "=============================================="

          echo ""
          echo "---- ERRORES ENCONTRADOS ----"

          grep -Ein \
            "error:|fatal:|failed|failure|ninja:.*error|meson.*error|undefined reference|cannot find|No such file|not found" \
            compilacion.log \
            | tail -80 || true

          echo ""
          echo "=============================================="
          echo "          ÚLTIMAS 120 LÍNEAS"
          echo "=============================================="

          tail -120 compilacion.log

      - name: Mostrar APK generado
        if: always()
        working-directory: vlc-segovia-tv-main
        run: |
          echo "======================================"
          echo "APK ENCONTRADOS"
          echo "======================================"

          find . -type f -name "*.apk" -print || true

      - name: Guardar APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: VLC-Segovia-TV-debug
          path: |
            vlc-segovia-tv-main/application/app/build/outputs/apk/**/*.apk
            vlc-segovia-tv-main/application/vlc-android/build/outputs/apk/**/*.apk
          if-no-files-found: error
