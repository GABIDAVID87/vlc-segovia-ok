name: Compilar SEGOVIA TV + VLC

on:
  workflow_dispatch:
  push:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 180

    steps:

      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Instalar dependencias de compilación
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            automake \
            autopoint \
            cmake \
            build-essential \
            libtool-bin \
            patch \
            pkg-config \
            protobuf-compiler \
            ragel \
            subversion \
            unzip \
            git \
            flex \
            python3 \
            wget \
            curl

      - name: Configurar Git
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"

      - name: Configurar Gradle 8.7
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.7"

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ""

      - name: Instalar Android SDK y NDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true

          sdkmanager --install \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;27.2.12479018"

      - name: Verificar herramientas Android
        run: |
          echo "======================================"
          echo "HERRAMIENTAS ANDROID"
          echo "======================================"

          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          java -version
          echo ""
          gradle --version
          echo ""
          sdkmanager --version

          echo ""
          echo "NDK:"
          ls -la "$ANDROID_HOME/ndk/27.2.12479018"

      - name: Preparar variables Android
        working-directory: vlc-segovia-tv-main
        run: |
          echo "ANDROID_SDK=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_NDK=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"

      - name: Preparar verificador de versión de Gradle
        working-directory: vlc-segovia-tv-main
        run: |
          mkdir -p buildsystem/gradle_version

          printf "%s\n" \
            "println 'gradle_version=' + gradle.getGradleVersion()" \
            > buildsystem/gradle_version/build.gradle

          echo "Verificador Gradle:"
          cat buildsystem/gradle_version/build.gradle

      - name: Preparar permisos
        working-directory: vlc-segovia-tv-main
        run: |
          chmod +x buildsystem/compile.sh
          find buildsystem -type f -name "*.sh" -exec chmod +x {} \;

          echo "Scripts ejecutables:"
          find buildsystem -type f -name "*.sh" -print

      - name: Descargar y preparar VLC
        working-directory: vlc-segovia-tv-main
        run: |
          set -e

          echo "======================================"
          echo "DESCARGANDO Y PREPARANDO VLC"
          echo "======================================"

          ANDROID_SDK="$ANDROID_HOME" \
          ANDROID_NDK="$ANDROID_HOME/ndk/27.2.12479018" \
          ./buildsystem/compile.sh --init

      - name: Corregir vlc.appdata.xml
        working-directory: vlc-segovia-tv-main
        run: |
          set -e

          echo "======================================"
          echo "CORRIGIENDO VLC APPDATA"
          echo "======================================"

          VLC_DIR="libvlcjni/vlc"
          BUILD_DIR="$VLC_DIR/build-android-aarch64-linux-android"

          echo "VLC_DIR=$VLC_DIR"
          echo "BUILD_DIR=$BUILD_DIR"

          echo ""
          echo "---- ARCHIVOS APPDATA EN FUENTE ----"

          find "$VLC_DIR/share" \
            -maxdepth 1 \
            -type f \
            -name "vlc.appdata.xml*" \
            -print || true

          echo ""
          echo "---- CREANDO APPDATA FINAL ----"

          mkdir -p "$BUILD_DIR/share"

          if [ -f "$BUILD_DIR/share/vlc.appdata.xml.in" ]; then

            cp \
              "$BUILD_DIR/share/vlc.appdata.xml.in" \
              "$BUILD_DIR/share/vlc.appdata.xml"

          elif [ -f "$VLC_DIR/share/vlc.appdata.xml.in" ]; then

            cp \
              "$VLC_DIR/share/vlc.appdata.xml.in" \
              "$BUILD_DIR/share/vlc.appdata.xml"

          else

            printf '%s\n' \
              '<?xml version="1.0" encoding="UTF-8"?>' \
              '<component type="desktop-application">' \
              '<id>org.videolan.vlc</id>' \
              '<name>VLC media player</name>' \
              '</component>' \
              > "$BUILD_DIR/share/vlc.appdata.xml"

          fi

          echo ""
          echo "---- APPDATA FINAL ----"

          ls -la \
            "$BUILD_DIR/share/vlc.appdata.xml"

          echo ""
          echo "======================================"
          echo "APPDATA CORREGIDO"
          echo "======================================"

      - name: Compilar VLC y Segovia TV
        working-directory: vlc-segovia-tv-main
        run: |
          set -o pipefail

          echo "======================================"
          echo "COMPILANDO VLC + SEGOVIA TV"
          echo "======================================"

          ANDROID_SDK="$ANDROID_HOME" \
          ANDROID_NDK="$ANDROID_HOME/ndk/27.2.12479018" \
          ./buildsystem/compile.sh -b 2>&1 | tee compilacion.log

      - name: Diagnóstico completo del fallo
        if: failure()
        working-directory: vlc-segovia-tv-main
        run: |
          echo ""
          echo "##################################################"
          echo "#                                                #"
          echo "#       DIAGNÓSTICO COMPLETO DE COMPILACIÓN     #"
          echo "#                                                #"
          echo "##################################################"

          echo ""
          echo "=================================================="
          echo "1. INFORMACIÓN DE LA EJECUCIÓN"
          echo "=================================================="

          date
          echo ""
          echo "Directorio actual:"
          pwd

          echo ""
          echo "Contenido principal:"
          ls -la | head -100

          echo ""
          echo "=================================================="
          echo "2. EXISTENCIA DEL LOG"
          echo "=================================================="

          if [ -f compilacion.log ]; then
            echo "OK: compilacion.log existe"
            echo "Tamaño:"
            wc -l compilacion.log
            ls -lh compilacion.log
          else
            echo "ATENCIÓN: compilacion.log NO existe"
          fi

          echo ""
          echo "=================================================="
          echo "3. ERRORES GENERALES"
          echo "=================================================="

          if [ -f compilacion.log ]; then
            grep -Ein \
              "error:|error |^error|ERROR:|ERROR |FAILED|failed|fatal|FATAL|undefined reference|No such file|not found|cannot |Could not|Exception|FAILURE|exit code|returned non-zero" \
              compilacion.log \
              | tail -250 || true
          fi

          echo ""
          echo "=================================================="
          echo "4. ERRORES DE VLC"
          echo "=================================================="

          if [ -f compilacion.log ]; then
            grep -Ein \
              "libvlcjni|/vlc/|vlc-|vlc\.appdata|configure:|make(\[[0-9]+\])?:|libtool:|contrib|modules/" \
              compilacion.log \
              | grep -Ei \
              "error|failed|fatal|not found|cannot|undefined|No such file|Could not|FAILURE|FAILED" \
              | tail -250 || true
          fi

          echo ""
          echo "=================================================="
          echo "5. ERRORES DE SEGOVIA TV"
          echo "=================================================="

          if [ -f compilacion.log ]; then
            grep -Ein \
              "application/segovia|com\.segovia|Segovia|segovia" \
              compilacion.log \
              | grep -Ei \
              "error|failed|fatal|not found|cannot|undefined|No such file|Could not|FAILURE|FAILED" \
              | tail -250 || true
          fi

          echo ""
          echo "=================================================="
          echo "6. ÚLTIMAS 500 LÍNEAS DEL LOG"
          echo "=================================================="

          if [ -f compilacion.log ]; then
            tail -500 compilacion.log
          else
            echo "No existe compilacion.log"
          fi

          echo ""
          echo "=================================================="
          echo "7. ÚLTIMAS LÍNEAS CON ERROR/FAILED"
          echo "=================================================="

          if [ -f compilacion.log ]; then
            grep -Ein \
              "error|failed|fatal|not found|cannot|undefined|No such file|Could not|FAILURE|FAILED" \
              compilacion.log \
              | tail -100 || true
          fi

          echo ""
          echo "=================================================="
          echo "8. CONTEXTO DE LOS ERRORES"
          echo "=================================================="

          if [ -f compilacion.log ]; then
            grep -Ein \
              "error:|ERROR:|FAILED|failed|fatal|FATAL|undefined reference|No such file|not found|cannot |Could not|Exception|FAILURE" \
              compilacion.log \
              | tail -30 \
              | cut -d: -f1 \
              | while read -r line; do
                  if [ -n "$line" ]; then
                    start=$((line-8))
                    [ "$start" -lt 1 ] && start=1
                    end=$((line+12))
                    echo ""
                    echo "---------------- CONTEXTO línea $line ----------------"
                    sed -n "${start},${end}p" compilacion.log
                  fi
                done
          fi

          echo ""
          echo "=================================================="
          echo "9. APPDATA VLC"
          echo "=================================================="

          find libvlcjni/vlc \
            -type f \
            \( \
              -iname "*appdata*" \
              -o \
              -iname "*appstream*" \
            \) \
            -print 2>/dev/null \
            | head -150 || true

          echo ""
          echo "---- APPDATA FINAL ----"

          ls -la \
            libvlcjni/vlc/share/vlc.appdata.xml \
            libvlcjni/vlc/share/vlc.appdata.xml.in \
            libvlcjni/vlc/share/vlc.appdata.xml.in.in \
            libvlcjni/vlc/build-android-aarch64-linux-android/share/vlc.appdata.xml \
            libvlcjni/vlc/build-android-aarch64-linux-android/share/vlc.appdata.xml.in \
            libvlcjni/vlc/build-android-aarch64-linux-android/install/share/metainfo/vlc.appdata.xml \
            2>/dev/null || true

          echo ""
          echo "=================================================="
          echo "10. HERRAMIENTAS DEL NDK"
          echo "=================================================="

          echo "ANDROID_NDK=$ANDROID_NDK"

          echo ""
          echo "aarch64-linux-android-nm:"
          command -v aarch64-linux-android-nm || true

          echo ""
          echo "Todos los nm disponibles:"
          find "$ANDROID_HOME/ndk/27.2.12479018" \
            -type f \
            \( \
              -name "aarch64-linux-android-nm" \
              -o \
              -name "llvm-nm" \
            \) \
            -print 2>/dev/null | head -50 || true

          echo ""
          echo "=================================================="
          echo "11. ESTADO DEL BUILD VLC"
          echo "=================================================="

          if [ -d libvlcjni/vlc/build-android-aarch64-linux-android ]; then
            echo "Build VLC existe."

            echo ""
            echo "Últimos archivos modificados:"
            find libvlcjni/vlc/build-android-aarch64-linux-android \
              -type f \
              -printf '%T@ %p\n' \
              2>/dev/null \
              | sort -n \
              | tail -50 || true
          else
            echo "No existe el directorio de build de VLC."
          fi

          echo ""
          echo "=================================================="
          echo "12. ESTADO DE SEGOVIA TV"
          echo "=================================================="

          echo ""
          echo "Archivos Kotlin de Segovia:"
          find application/segovia \
            -type f \
            \( -name "*.kt" -o -name "*.java" \) \
            -print 2>/dev/null \
            | head -150 || true

          echo ""
          echo "Archivos Gradle de Segovia:"
          find application/segovia \
            -type f \
            \( -name "build.gradle" -o -name "build.gradle.kts" \) \
            -print 2>/dev/null || true

          echo ""
          echo "=================================================="
          echo "13. APK ENCONTRADOS AUNQUE EL BUILD HAYA FALLADO"
          echo "=================================================="

          find . \
            -type f \
            -name "*.apk" \
            -print 2>/dev/null || true

          echo ""
          echo "=================================================="
          echo "14. ÚLTIMA INFORMACIÓN DEL PROCESO"
          echo "=================================================="

          if [ -f compilacion.log ]; then
            echo ""
            echo "Últimas 100 líneas:"
            tail -100 compilacion.log
          fi

          echo ""
          echo "=================================================="
          echo "15. VERIFICACIÓN DE PERMISOS DE SCRIPTS"
          echo "=================================================="

          echo ""
          echo "Scripts del buildsystem:"
          find buildsystem \
            -type f \
            -name "*.sh" \
            -exec ls -l {} \; \
            2>/dev/null || true

          echo ""
          echo "Permiso específico de compile-medialibrary.sh:"
          if [ -f buildsystem/compile-medialibrary.sh ]; then
            ls -l buildsystem/compile-medialibrary.sh
            file buildsystem/compile-medialibrary.sh
          else
            echo "No existe buildsystem/compile-medialibrary.sh"
          fi

          echo ""
          echo "##################################################"
          echo "#          FIN DEL DIAGNÓSTICO COMPLETO         #"
          echo "##################################################"

      - name: Mostrar APK generado
        if: always()
        working-directory: vlc-segovia-tv-main
        run: |
          echo "======================================"
          echo "APK ENCONTRADOS"
          echo "======================================"

          find . \
            -type f \
            -name "*.apk" \
            -print 2>/dev/null || true

      - name: Guardar APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: VLC-Segovia-TV-debug
          path: |
            vlc-segovia-tv-main/application/app/build/outputs/apk/**/*.apk
            vlc-segovia-tv-main/application/vlc-android/build/outputs/apk/**/*.apk
          if-no-files-found: error
