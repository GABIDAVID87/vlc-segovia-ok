name: Compilar SEGOVIA TV + VLC

on:
  workflow_dispatch:
  push:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 180

    steps:

      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Instalar dependencias de compilación
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            automake \
            autopoint \
            cmake \
            build-essential \
            libtool-bin \
            patch \
            pkg-config \
            protobuf-compiler \
            ragel \
            subversion \
            unzip \
            git \
            flex \
            python3 \
            wget \
            curl

      - name: Configurar Git
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"

      - name: Configurar Gradle 8.7
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.7"

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ""

      - name: Instalar Android SDK y NDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true

          sdkmanager --install \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;27.2.12479018"

      - name: Verificar herramientas Android
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          java -version
          gradle --version
          sdkmanager --version

          echo "NDK:"
          ls -la "$ANDROID_HOME/ndk/27.2.12479018"

      - name: Preparar variables Android
        working-directory: vlc-segovia-tv-main
        run: |
          echo "ANDROID_SDK=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_NDK=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"

      - name: Preparar verificador de versión de Gradle
        working-directory: vlc-segovia-tv-main
        run: |
          mkdir -p buildsystem/gradle_version

          printf "%s\n" \
            "println 'gradle_version=' + gradle.getGradleVersion()" \
            > buildsystem/gradle_version/build.gradle

          echo "Verificador Gradle creado:"
          cat buildsystem/gradle_version/build.gradle

      - name: Preparar permisos
        working-directory: vlc-segovia-tv-main
        run: |
          chmod +x buildsystem/compile.sh

      - name: Preparar VLC
        working-directory: vlc-segovia-tv-main
        run: |
          set -e

          ANDROID_SDK="$ANDROID_HOME" \
          ANDROID_NDK="$ANDROID_HOME/ndk/27.2.12479018" \
          ./buildsystem/compile.sh --init -b

      - name: Corregir vlc.appdata.xml
        working-directory: vlc-segovia-tv-main
        run: |
          set -e

          echo "======================================"
          echo "CORRECCIÓN DE VLC APPDATA"
          echo "======================================"

          VLC_DIR="libvlcjni/vlc"
          BUILD_DIR="$VLC_DIR/build-android-aarch64-linux-android"

          echo "VLC_DIR=$VLC_DIR"
          echo "BUILD_DIR=$BUILD_DIR"

          echo ""
          echo "Buscando archivo fuente..."

          find "$VLC_DIR" \
            -type f \
            \( -name "vlc.appdata.xml.in.in" -o -name "vlc.appdata.xml.in" -o -name "vlc.appdata.xml" \) \
            -print || true

          echo ""
          echo "Generando vlc.appdata.xml..."

          if [ -f "$VLC_DIR/share/vlc.appdata.xml.in.in" ]; then
            sed \
              -e 's/@PACKAGE_NAME@/VLC media player/g' \
              -e 's/@PACKAGE_VERSION@/3.0.0/g' \
              -e 's/@PACKAGE@/vlc/g' \
              "$VLC_DIR/share/vlc.appdata.xml.in.in" \
              > "$VLC_DIR/share/vlc.appdata.xml.in"
          fi

          if [ -f "$BUILD_DIR/share/vlc.appdata.xml.in" ]; then
            cp \
              "$BUILD_DIR/share/vlc.appdata.xml.in" \
              "$BUILD_DIR/share/vlc.appdata.xml"
          elif [ -f "$VLC_DIR/share/vlc.appdata.xml.in" ]; then
            cp \
              "$VLC_DIR/share/vlc.appdata.xml.in" \
              "$BUILD_DIR/share/vlc.appdata.xml"
          else
            echo "No se encontró vlc.appdata.xml.in."
            echo "Creando archivo vacío para evitar el fallo de instalación."

            mkdir -p "$BUILD_DIR/share"

            printf '%s\n' \
              '<?xml version="1.0" encoding="UTF-8"?>' \
              '<component type="desktop-application">' \
              '<id>org.videolan.vlc</id>' \
              '<name>VLC media player</name>' \
              '</component>' \
              > "$BUILD_DIR/share/vlc.appdata.xml"
          fi

          echo ""
          echo "Archivos resultantes:"

          ls -la \
            "$VLC_DIR/share/vlc.appdata.xml" \
            "$VLC_DIR/share/vlc.appdata.xml.in" \
            "$BUILD_DIR/share/vlc.appdata.xml" \
            2>/dev/null || true

          echo ""
          echo "======================================"
          echo "FIN DE LA CORRECCIÓN"
          echo "======================================"

      - name: Compilar VLC y Segovia TV
        working-directory: vlc-segovia-tv-main
        run: |
          set -o pipefail

          ANDROID_SDK="$ANDROID_HOME" \
          ANDROID_NDK="$ANDROID_HOME/ndk/27.2.12479018" \
          ./buildsystem/compile.sh -b 2>&1 | tee compilacion.log

      - name: Diagnosticar fallo VLC
        if: failure()
        working-directory: vlc-segovia-tv-main
        run: |
          echo ""
          echo "=================================================="
          echo "       DIAGNÓSTICO DEL FALLO DE VLC"
          echo "=================================================="

          echo ""
          echo "---- REFERENCIAS A vlc.appdata.xml ----"
          grep -Rni \
            --exclude-dir=.git \
            --exclude=compilacion.log \
            "vlc.appdata.xml" \
            . 2>/dev/null | head -100 || true

          echo ""
          echo "---- ARCHIVOS appdata EN VLC ----"
          find libvlcjni/vlc \
            -type f \
            \( -iname "*appdata*" -o -iname "*appstream*" \) \
            -print 2>/dev/null | head -100 || true

          echo ""
          echo "---- MAKEFILES QUE MENCIONAN appdata ----"
          grep -Rni \
            --include='Makefile' \
            --include='Makefile.in' \
            --include='Makefile.am' \
            --include='*.mk' \
            "appdata" \
            libvlcjni/vlc 2>/dev/null | head -100 || true

          echo ""
          echo "---- EXISTENCIA DE ARCHIVOS ----"

          echo "Fuente:"
          ls -la \
            libvlcjni/vlc/share/vlc.appdata.xml \
            libvlcjni/vlc/share/vlc.appdata.xml.in \
            libvlcjni/vlc/share/vlc.appdata.xml.in.in \
            2>/dev/null || true

          echo ""
          echo "Build:"
          ls -la \
            libvlcjni/vlc/build-android-aarch64-linux-android/share/vlc.appdata.xml \
            libvlcjni/vlc/build-android-aarch64-linux-android/share/vlc.appdata.xml.in \
            2>/dev/null || true

          echo ""
          echo "---- aarch64-linux-android-nm ----"
          command -v aarch64-linux-android-nm || true

          echo ""
          echo "---- ÚLTIMAS 160 LÍNEAS DEL LOG ----"
          tail -160 compilacion.log || true

          echo ""
          echo "=================================================="
          echo "       FIN DEL DIAGNÓSTICO"
          echo "=================================================="

      - name: Mostrar APK generado
        if: always()
        working-directory: vlc-segovia-tv-main
        run: |
          echo "======================================"
          echo "APK ENCONTRADOS"
          echo "======================================"

          find . -type f -name "*.apk" -print || true

      - name: Guardar APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: VLC-Segovia-TV-debug
          path: |
            vlc-segovia-tv-main/application/app/build/outputs/apk/**/*.apk
            vlc-segovia-tv-main/application/vlc-android/build/outputs/apk/**/*.apk
          if-no-files-found: error
